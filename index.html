<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111019">
  <title>숨겨진 지식 — 미스터리 상식 퀴즈</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #111019;
      --card: #1b1925;
      --card-soft: #22202e;
      --line: #393545;
      --text: #f4f0e8;
      --muted: #a8a3b1;
      --gold: #e7c77b;
      --gold-bright: #f4d995;
      --green: #9ed5b3;
      --red: #f0a5a5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 34px 18px 24px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -15%, rgba(101, 82, 132, 0.25), transparent 55%),
        radial-gradient(circle at 12% 20%, rgba(231, 199, 123, 0.55) 0 1px, transparent 1.8px),
        radial-gradient(circle at 85% 38%, rgba(231, 199, 123, 0.45) 0 1px, transparent 1.8px),
        radial-gradient(circle at 74% 11%, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.8px),
        var(--page);
      background-size: auto, 170px 190px, 230px 210px, 270px 240px, auto;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    .page {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .masthead {
      margin: 8px 0 25px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-align: center;
    }

    .masthead span {
      display: block;
      margin-bottom: 10px;
      color: var(--text);
      font-size: 21px;
      letter-spacing: 0.09em;
    }

    .card {
      overflow: hidden;
      padding: clamp(23px, 6vw, 42px);
      border: 1px solid rgba(231, 199, 123, 0.22);
      border-radius: 22px;
      background: linear-gradient(150deg, rgba(31, 29, 42, 0.97), rgba(22, 20, 30, 0.97));
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1,
    h2 {
      margin: 0;
      font-family: Georgia, "Batang", serif;
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    h1 {
      font-size: clamp(29px, 7vw, 43px);
      line-height: 1.25;
    }

    h2 {
      font-size: clamp(23px, 5.7vw, 32px);
      line-height: 1.45;
    }

    .intro {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 30px 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .progress-row strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      border-radius: 99px;
      background: #393644;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #b79a5b, var(--gold-bright));
      transition: width 240ms ease;
    }

    .question {
      margin: 30px 0 22px;
    }

    .answers {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .answer {
      display: flex;
      min-height: 57px;
      align-items: center;
      gap: 13px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--text);
      cursor: pointer;
      line-height: 1.5;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:hover {
      transform: translateY(-1px);
      border-color: rgba(231, 199, 123, 0.7);
      background: rgba(231, 199, 123, 0.07);
    }

    .answer:focus-visible,
    .primary-button:focus-visible,
    .instagram-link:focus-visible {
      outline: 3px solid var(--gold-bright);
      outline-offset: 3px;
    }

    .answer input {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--gold);
    }

    .answer:has(input:checked) {
      border-color: var(--gold);
      background: rgba(231, 199, 123, 0.11);
    }

    .answer:has(input:disabled) {
      cursor: default;
    }

    .primary-button {
      width: 100%;
      min-height: 54px;
      margin-top: 20px;
      padding: 14px 20px;
      border: 0;
      border-radius: 13px;
      background: var(--gold);
      color: #1b1720;
      cursor: pointer;
      font-weight: 750;
      transition: background 160ms ease, transform 160ms ease;
    }

    .primary-button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--gold-bright);
    }

    .primary-button:disabled {
      background: #514d54;
      color: #bab5be;
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 23px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.035);
    }

    .feedback[hidden] {
      display: none;
    }

    .feedback-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 750;
    }

    .feedback-title.correct {
      color: var(--green);
    }

    .feedback-title.incorrect {
      color: var(--red);
    }

    .explanation {
      margin: 0;
      color: #d8d4dc;
      font-size: 14px;
      line-height: 1.75;
    }

    .source {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .source a {
      color: var(--gold-bright);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .completion {
      padding: 26px 0 8px;
      text-align: center;
    }

    .completion-mark {
      display: grid;
      width: 74px;
      height: 74px;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid rgba(231, 199, 123, 0.55);
      border-radius: 50%;
      color: var(--gold-bright);
      font-family: Georgia, serif;
      font-size: 34px;
    }

    .completion p {
      max-width: 390px;
      margin: 15px auto 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .completion[hidden] {
      display: none;
    }

    footer {
      padding: 23px 10px 0;
      color: #85818e;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-align: center;
    }

    footer p {
      margin: 0 0 11px;
    }

    .instagram-link {
      color: var(--gold);
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    .instagram-link:hover {
      color: var(--gold-bright);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 420px) {
      body {
        padding: 23px 13px 20px;
      }

      .masthead {
        margin-bottom: 19px;
      }

      .card {
        border-radius: 17px;
      }

      .answer {
        min-height: 54px;
        padding: 12px;
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <span>A LITTLE MYSTERY</span>
      THE SECRET KNOWLEDGE CLUB
    </header>

    <section class="card" aria-labelledby="page-title">
      <div id="quiz-view">
        <p class="eyebrow">오늘의 작은 수수께끼</p>
        <h1 id="page-title">세 가지 지식의 문</h1>
        <p class="intro">무작위로 찾아온 상식 세 가지. 답을 고르고, 숨겨진 이야기를 확인해 보세요.</p>

        <div class="progress-row">
          <span id="progress-label">첫 번째 문제</span>
          <strong id="progress-count">01 / 03</strong>
        </div>
        <div
          class="progress-track"
          id="progress-track"
          role="progressbar"
          aria-label="퀴즈 진행 상황"
          aria-valuemin="0"
          aria-valuemax="3"
          aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question">
          <p class="eyebrow" id="question-category"></p>
          <h2 id="question-text"></h2>
        </div>

        <fieldset class="answers" id="answers" aria-label="답을 선택하세요"></fieldset>
        <button class="primary-button" id="submit-button" type="button" disabled>답 확인하기</button>

        <section class="feedback" id="feedback" aria-live="polite" hidden>
          <p class="feedback-title" id="feedback-title"></p>
          <p class="explanation" id="explanation"></p>
          <p class="source" id="source"></p>
          <button class="primary-button" id="next-button" type="button">다음 문제</button>
        </section>
      </div>

      <section class="completion" id="completion-view" aria-labelledby="completion-title" hidden>
        <div class="completion-mark" aria-hidden="true">✦</div>
        <p class="eyebrow">THE END OF THIS LITTLE MYSTERY</p>
        <h1 id="completion-title">세 가지 문을 모두 열었어요.</h1>
        <p>새로운 세 가지 상식이 기다리고 있어요. 다시 도전해 볼까요?</p>
        <button class="primary-button" id="restart-button" type="button">다시 풀기</button>
      </section>
    </section>

    <footer>
      <p>NOTHING IS ORDINARY</p>
      <a
        class="instagram-link"
        href="https://www.instagram.com/h.dokko?xtok=MXRhYmlkMjhoYXlvMQ%3D%3D&amp;utm_source=qr"
        target="_blank"
        rel="noopener noreferrer">INSTAGRAM · @H.DOKKO</a>
    </footer>
  </main>

  <script src="quiz-data.js"></script>
  <script>
    const QUIZ_LENGTH = 3;
    const quizView = document.getElementById("quiz-view");
    const completionView = document.getElementById("completion-view");
    const progressLabel = document.getElementById("progress-label");
    const progressCount = document.getElementById("progress-count");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");
    const questionCategory = document.getElementById("question-category");
    const questionText = document.getElementById("question-text");
    const answers = document.getElementById("answers");
    const submitButton = document.getElementById("submit-button");
    const feedback = document.getElementById("feedback");
    const feedbackTitle = document.getElementById("feedback-title");
    const explanation = document.getElementById("explanation");
    const source = document.getElementById("source");
    const nextButton = document.getElementById("next-button");
    const restartButton = document.getElementById("restart-button");

    let selectedQuestions = [];
    let currentQuestionIndex = 0;

    function shuffle(items) {
      const shuffled = [...items];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function startQuiz() {
      selectedQuestions = shuffle(quizQuestions).slice(0, QUIZ_LENGTH);
      currentQuestionIndex = 0;
      quizView.hidden = false;
      completionView.hidden = true;
      renderQuestion();
    }

    function renderQuestion() {
      const question = selectedQuestions[currentQuestionIndex];
      const questionNumber = currentQuestionIndex + 1;

      progressLabel.textContent = ["첫 번째 문제", "두 번째 문제", "마지막 문제"][currentQuestionIndex];
      progressCount.textContent = `${String(questionNumber).padStart(2, "0")} / ${String(QUIZ_LENGTH).padStart(2, "0")}`;
      progressTrack.setAttribute("aria-valuenow", String(currentQuestionIndex));
      progressFill.style.width = `${(currentQuestionIndex / QUIZ_LENGTH) * 100}%`;
      questionCategory.textContent = question.category;
      questionText.textContent = question.question;
      answers.replaceChildren();

      question.choices.forEach((choice, index) => {
        const label = document.createElement("label");
        label.className = "answer";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = "quiz-answer";
        input.value = String(index);
        input.addEventListener("change", () => {
          submitButton.disabled = false;
        });

        const text = document.createElement("span");
        text.textContent = choice;
        label.append(input, text);
        answers.append(label);
      });

      feedback.hidden = true;
      submitButton.hidden = false;
      submitButton.disabled = true;
      nextButton.textContent = questionNumber === QUIZ_LENGTH ? "결과 보기" : "다음 문제";
    }

    function submitAnswer() {
      const selectedAnswer = answers.querySelector('input[name="quiz-answer"]:checked');
      if (!selectedAnswer) {
        return;
      }

      const question = selectedQuestions[currentQuestionIndex];
      const isCorrect = Number(selectedAnswer.value) === question.answerIndex;

      answers.querySelectorAll("input").forEach((input) => {
        input.disabled = true;
      });
      submitButton.hidden = true;

      feedbackTitle.textContent = isCorrect
        ? "정답이에요!"
        : `아쉬워요. 정답은 ${question.choices[question.answerIndex]}예요.`;
      feedbackTitle.className = `feedback-title ${isCorrect ? "correct" : "incorrect"}`;
      explanation.textContent = question.explanation;

      const sourceLink = document.createElement("a");
      sourceLink.href = question.sourceUrl;
      sourceLink.target = "_blank";
      sourceLink.rel = "noopener noreferrer";
      sourceLink.textContent = `${question.sourceOrg} 원문 확인`;
      source.replaceChildren(document.createTextNode("출처: "), sourceLink);

      feedback.hidden = false;
      nextButton.focus();
    }

    function goToNextQuestion() {
      currentQuestionIndex += 1;
      if (currentQuestionIndex === QUIZ_LENGTH) {
        quizView.hidden = true;
        completionView.hidden = false;
        restartButton.focus();
        return;
      }
      renderQuestion();
      questionText.focus();
    }

    submitButton.addEventListener("click", submitAnswer);
    nextButton.addEventListener("click", goToNextQuestion);
    restartButton.addEventListener("click", startQuiz);

    startQuiz();
  </script>
</body>
</html>
