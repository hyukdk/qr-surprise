<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>You Found Something</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 420px;
      width: 100%;
    }

    .tag {
      color: #a3a3a3;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 34px;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    p {
      color: #cccccc;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: 1px solid #555555;
      border-radius: 12px;
      background: #222222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #383838;
    }

    #result {
      margin-top: 28px;
      font-size: 18px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .small {
      margin-top: 45px;
      font-size: 11px;
      color: #777777;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="tag">A LITTLE MYSTERY</div>

    <h1>YOU FOUND<br>SOMETHING.</h1>

    <p>
      당신은 왜 이 QR 코드를 스캔했나요?
      <br>
      솔직하게 선택해 주세요.
    </p>

    <button data-answer="curious">
      🤔 그냥 궁금해서
    </button>

    <button data-answer="secret">
      🔍 뭔가 있을 것 같아서
    </button>

    <div id="result" aria-live="polite"></div>

    <div class="small">
      NOTHING IS ORDINARY
    </div>

  </main>

  <script>
    const result = document.getElementById("result");

    document.querySelectorAll("[data-answer]").forEach(button => {
      button.addEventListener("click", () => {

        if (button.dataset.answer === "curious") {
          result.textContent =
            "호기심이 많으시군요. 😎\n\n" +
            "축하합니다.\n" +
            "당신은 이 페이지를 발견했습니다.";
        } else {
          result.textContent =
            "쉿... 비밀입니다. 🤫\n\n" +
            "사실 별거 없어요.\n" +
            "그래도 여기까지 오셨네요!";
        }

      });
    });
  </script>

</body>
</html>
